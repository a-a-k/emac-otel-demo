name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Unit tests
        run: go test -race -coverprofile=coverage.out ./...
      - name: RQ1 finite-support soundness suite
        run: go run ./cmd/emacctl rq1-validate --cases 10000 --seed 20270811 --out rq1-validation.json
      - name: Static analysis
        run: go vet ./...
      - name: Build executables
        run: go build ./cmd/...
      - name: Verify pinned submodules and protocol vector
        shell: bash
        run: ./scripts/verify-pins.sh
      - uses: actions/upload-artifact@v4
        with:
          name: unit-test-evidence
          path: |
            coverage.out
            rq1-validation.json
          if-no-files-found: error

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.checkout-policy
          push: false
          load: true
          tags: emac/checkout-policy:ci
      - name: Validate pinned Collector configuration
        run: >-
          docker run --rm
          -v "$PWD/deploy/collector/config.yaml:/etc/emac/collector.yaml:ro"
          ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0@sha256:4eb842091c796156d4d3c994eb22ba793590f5723719dbf6b8436cb4dfc17f48
          validate --config=/etc/emac/collector.yaml
