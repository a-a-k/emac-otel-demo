services:
  # Capacity is intentionally provisioned above the Demo's tiny showcase
  # limits so the experiment tests composition rather than container OOM
  # pressure. The frozen saturation checks still reject CPU/memory >= limits.
  checkout:
    deploy:
      resources:
        limits: { memory: 40M }

  payment:
    deploy:
      resources:
        limits: { memory: 40M }

  product-catalog:
    deploy:
      resources:
        limits: { memory: 40M }

  quote:
    deploy:
      resources:
        limits: { memory: 80M }

  otel-collector:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.157.0@sha256:4eb842091c796156d4d3c994eb22ba793590f5723719dbf6b8436cb4dfc17f48
    command: ["--config=/etc/emac/collector.yaml"]
    volumes:
      - ${EMAC_RESULTS}/collector.yaml:/etc/emac/collector.yaml:ro
      - ${EMAC_RESULTS}/metrics:/var/lib/emac/metrics
    ports:
      - "8888:8888"

  bering100:
    image: ghcr.io/mb3r-lab/bering:v1.0.0@sha256:019cd1e4e22eed1323ce788ac03216014d6b1989b451caafe013143507628d3f
    command: ["serve", "--config", "/etc/bering/serve.yaml"]
    volumes:
      - ${EMAC_ROOT}/deploy/bering/serve.yaml:/etc/bering/serve.yaml:ro
      - ${EMAC_RESULTS}/bering/100:/var/lib/bering

  bering25:
    image: ghcr.io/mb3r-lab/bering:v1.0.0@sha256:019cd1e4e22eed1323ce788ac03216014d6b1989b451caafe013143507628d3f
    command: ["serve", "--config", "/etc/bering/serve.yaml"]
    volumes:
      - ${EMAC_ROOT}/deploy/bering/serve.yaml:/etc/bering/serve.yaml:ro
      - ${EMAC_RESULTS}/bering/25:/var/lib/bering

  bering05:
    image: ghcr.io/mb3r-lab/bering:v1.0.0@sha256:019cd1e4e22eed1323ce788ac03216014d6b1989b451caafe013143507628d3f
    command: ["serve", "--config", "/etc/bering/serve.yaml"]
    volumes:
      - ${EMAC_ROOT}/deploy/bering/serve.yaml:/etc/bering/serve.yaml:ro
      - ${EMAC_RESULTS}/bering/05:/var/lib/bering

  flagd:
    command: ["start", "--uri", "file:./etc/flagd/demo.flagd.json"]
    volumes:
      - ${EMAC_RESULTS}/flagd:/etc/flagd:ro

  checkout-policy:
    build:
      context: ${EMAC_ROOT}
      dockerfile: Dockerfile.checkout-policy
    environment:
      LISTEN_ADDR: :8080
      FRONTEND_ADDR: http://frontend:8080
      SHIPPING_ADDR: http://shipping:50050
      CART_ADDR: cart:7070
      CURRENCY_ADDR: currency:7001
      FLAGD_HOST: flagd
      FLAGD_PORT: 8013
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://otel-collector:4318/v1/metrics
      EMAC_RUN_SEED: ${EMAC_RUN_SEED}
      EMAC_WEIGHT: ${EMAC_WEIGHT}
      EMAC_LEDGER_PATH: /var/lib/emac/ledger.jsonl
      EMAC_HISTOGRAM_GRID_MS: ${EMAC_HISTOGRAM_GRID_MS:-}
    volumes:
      - ${EMAC_RESULTS}/policy:/var/lib/emac
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "/checkout-policy", "healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 30
    depends_on:
      otel-collector: { condition: service_started }
      bering100: { condition: service_started }
      bering25: { condition: service_started }
      bering05: { condition: service_started }
      cart: { condition: service_started }
      currency: { condition: service_healthy }
      frontend: { condition: service_healthy }
      shipping: { condition: service_started }
      flagd: { condition: service_started }
